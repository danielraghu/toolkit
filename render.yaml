services:
  - type: web
    name: toolkit
    runtime: node
    plan: free
    buildCommand: npx prisma generate && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: toolkit-db
          property: connectionString
    disk:
      name: data
      mountPath: /opt/render/project/src/db
      sizeGB: 1

databases:
  - name: toolkit-db
    databaseName: toolkit
    plan: free